name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version from package.json, without the v prefix
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-v${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    env:
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: node scripts/release.mjs verify "$VERSION"
      - name: Verify the recorded source commit
        run: |
          generation_commit="$(node -p "require('./registry-release.json').generationCommit")"
          git merge-base --is-ancestor "$generation_commit" "$GITHUB_SHA"
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm security:audit
      - run: pnpm registry:build
      - run: pnpm registry:validate
      - run: pnpm registry:consumer-check
      - run: pnpm build
      - run: pnpm build:budget
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - name: Verify generated output and clean release tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            exit 1
          fi

      - name: Verify the deployed immutable registry
        run: node scripts/verify-deployed-registry.mjs "$VERSION"

      - name: Prepare release notes and assets
        run: |
          node scripts/release.mjs notes "$VERSION" > release-notes.md
          tar -czf "mizu-registry-$TAG.tar.gz" "static/r/$TAG"
          cp "static/r/$TAG/manifest.json" "mizu-registry-$TAG-manifest.json"
          sha256sum "mizu-registry-$TAG.tar.gz" "mizu-registry-$TAG-manifest.json" > "mizu-registry-$TAG.sha256"

      - name: Create or verify the annotated tag
        run: |
          git fetch --tags --force
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            test "$(git cat-file -t "refs/tags/$TAG")" = tag
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Mizu $TAG"
            git push origin "$TAG"
          fi

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "$VERSION" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Mizu $TAG" --notes-file release-notes.md "${release_flags[@]}"
            gh release upload "$TAG" --clobber "mizu-registry-$TAG.tar.gz" "mizu-registry-$TAG-manifest.json" "mizu-registry-$TAG.sha256"
          else
            gh release create "$TAG" --verify-tag --title "Mizu $TAG" --notes-file release-notes.md "${release_flags[@]}" "mizu-registry-$TAG.tar.gz" "mizu-registry-$TAG-manifest.json" "mizu-registry-$TAG.sha256"
          fi
